services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.0-flash}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are SARA (Smart Adaptive Response Assistant), a helpful, clear, and thoughtful AI assistant.}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    volumes:
      - sara-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  sara-data:
